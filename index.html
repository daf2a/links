<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tautan resmi Muhammad Daffa Ashdaqfillah."
    />
    <meta name="theme-color" content="#000000" />
    <title>Muhammad Daffa Ashdaqfillah</title>
    <link rel="icon" href="assets/profile.jpeg" type="image/jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
  </head>
  <body>
    <main class="profile" aria-labelledby="profile-name" aria-describedby="profile-photo-description">
      <span id="profile-photo-description" class="sr-only">Foto profil Muhammad Daffa Ashdaqfillah</span>
      <header class="profile__header">
        <div class="profile__photo" aria-hidden="true">
          <img
            src="assets/profile.jpeg"
            alt=""
            width="176"
            height="176"
          />
        </div>
        <h1 id="profile-name">Muhammad Daffa Ashdaqfillah</h1>
      </header>

      <nav class="links" aria-label="Tautan utama">
        <a class="link-button" data-link="linkedin">LinkedIn</a>
        <a class="link-button" data-link="portfolio">Portofolio</a>
        <a class="link-button" data-link="github">GitHub</a>
        <a class="link-button" data-link="resume">Resume / CV</a>
      </nav>

      <footer class="socials">
        <a
          class="social-link"
          data-link="instagram"
          aria-label="Instagram Muhammad Daffa Ashdaqfillah"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            width="34"
            height="34"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2" />
            <circle cx="12" cy="12" r="4.25" stroke="currentColor" stroke-width="2" />
            <circle cx="17.4" cy="6.7" r="1.15" fill="currentColor" />
          </svg>
        </a>
      </footer>
    </main>
  </body>
</html>
